# Generate the Xcode project with `xcodegen generate`. The .xcodeproj is not committed: this file is
# the single source of truth for targets, settings, version and build number.
name: SuperMealPlanner
options:
  bundleIdPrefix: io.github.geiserx
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    # Version and build number live only here. A merge that bumps MARKETING_VERSION is released to
    # TestFlight by release.yml, which sets the build number to the commit count of main.
    MARKETING_VERSION: 0.3.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 624WUVM8B4
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  SuperMealPlanner:
    type: application
    platform: iOS
    sources:
      - path: SuperMealPlanner
      - path: Shared
    info:
      path: SuperMealPlanner/Info.plist
      properties:
        CFBundleDisplayName: Comidas
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.food-and-drink
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # A household server is usually a name on a home network with a private certificate, so the
        # app must be allowed to talk to it. Only local names: everything public stays TLS-only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: SuperMealPlanner/SuperMealPlanner.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.geiserx.supermealplanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.geiserx.supermealplanner
        # iPhone only. Set per target: XcodeGen's target default ("1,2") overrides the project-level
        # value, and an iPad build must support all four orientations or upload fails (error 90474).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: SuperMealPlanner App Store
    dependencies:
      - target: SuperMealPlannerWidget

  SuperMealPlannerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SuperMealPlannerWidget
      - path: Shared
    info:
      path: SuperMealPlannerWidget/Info.plist
      properties:
        CFBundleDisplayName: Comidas
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SuperMealPlannerWidget/SuperMealPlannerWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.geiserx.supermealplanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.geiserx.supermealplanner.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: SuperMealPlanner Widget App Store

  SuperMealPlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SuperMealPlannerUITests
    dependencies:
      - target: SuperMealPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.geiserx.supermealplanner.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SuperMealPlanner

  SuperMealPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SuperMealPlannerTests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.geiserx.supermealplanner.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SuperMealPlanner:
    build:
      targets:
        SuperMealPlanner: all
        SuperMealPlannerWidget: all
        SuperMealPlannerTests: [test]
        SuperMealPlannerUITests: [test]
    test:
      targets: [SuperMealPlannerTests, SuperMealPlannerUITests]
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
