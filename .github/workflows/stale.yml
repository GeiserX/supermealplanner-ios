name: Close stale issues

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

# Nothing at the top level, so a job added later starts with none of these.
permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      actions: write        # actions/stale saves its processing state between runs
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 14
          days-before-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-issue-labels: pinned
          stale-issue-message: "This issue has had no activity for 14 days and will be closed in 14 more unless someone comments."
          close-issue-message: "Closed after 28 days without activity. If it still matters, open a new issue."
